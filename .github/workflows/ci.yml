name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  obsidian-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18+ runs the TypeScript unit tests without a build step.
          node-version: 22
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # WebKit is the engine of Obsidian on iOS, Chromium of desktop and Android.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Encoder smoke test in Chromium and WebKit
        run: npm run test:browser
