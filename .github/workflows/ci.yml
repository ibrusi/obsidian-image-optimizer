name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install image tools for integration tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends webp gifsicle ffmpeg

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2024.1.1 ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Build
        run: go build -o bin/obsidian-img-opt ./cmd/obsidian-img-opt

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check plugin syntax
        run: node --check obsidian-plugin/main.js

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('obsidian-plugin/manifest.json', 'utf8'))"

  webp-prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/mobile-webp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18+ runs the TypeScript unit tests without a build step.
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/mobile-webp/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # WebKit is the engine of Obsidian on iOS, Chromium of desktop and Android.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Encoder smoke test in Chromium and WebKit
        run: npm run test:browser
