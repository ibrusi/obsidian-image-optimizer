name: WebP prototype release

# Publishes the mobile WebP prototype as a pre-release, installable with BRAT
# or by unpacking the zip into <vault>/.obsidian/plugins/. A release is made
# once per manifest version: bump the version in manifest.json to publish.
on:
  push:
    branches: [feat/mobile-webp-prototype]
    paths: [prototype/mobile-webp/**, .github/workflows/prototype-release.yml]
  workflow_dispatch:

concurrency:
  group: webp-prototype-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/mobile-webp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/mobile-webp/package-lock.json

      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; bump the manifest version to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        run: npm run typecheck
      - if: steps.version.outputs.publish == 'true'
        run: npm test
      - if: steps.version.outputs.publish == 'true'
        run: npm run build

      - name: Package
        if: steps.version.outputs.publish == 'true'
        run: |
          mkdir -p dist/webp-prototype
          cp main.js manifest.json dist/webp-prototype/
          (cd dist && zip -r webp-prototype.zip webp-prototype)

      - name: Publish pre-release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            main.js manifest.json dist/webp-prototype.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "WebP prototype $VERSION" \
            --notes "Prototype of in-app WebP conversion for desktop and mobile. Not for production vaults: test on a copy. Installation and test steps: prototype/mobile-webp/README.md."
